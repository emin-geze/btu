<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Bilinçli Teknoloji Üreticileri Forum</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- RECAPTCHA KÜTÜPHANESİ (Eklendi) -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LfYMPMsAAAAAHnl9mxKR0TgmG-zT_NdIVS72_MC"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- ŞIK POPUP / MODAL -->
  <div id="customModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 border border-gray-100 transform scale-95 transition-all duration-200">
      <div id="modalIcon" class="flex items-center justify-center bg-amber-100 text-amber-600 w-12 h-12 rounded-full mb-4 mx-auto">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      </div>
      <h3 id="modalTitle" class="text-lg font-bold text-gray-900 text-center mb-2">E-posta Zaten Kayıtlı!</h3>
      <p id="modalMessage" class="text-sm text-gray-500 text-center leading-relaxed mb-6">Bu e-posta adresi ile daha önce başka bir yöntemle giriş yapılmış. Lütfen ilk kullandığınız yöntemi (Google veya GitHub) tercih edin.</p>
      <button id="modalCloseBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 px-4 rounded-xl transition shadow-sm">
        Anladım
      </button>
    </div>
  </div>

  <!-- Üst Menü (Navbar) -->
  <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-600">BTU Forum</h1>
      <div id="authContainer" class="flex gap-2">
        <button id="btnGoogle" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Google ile Giriş</button>
        <button id="btnGithub" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition">GitHub ile Giriş</button>
      </div>
      <div id="userProfile" class="hidden flex items-center gap-4">
        <span id="userName" class="text-sm font-medium text-gray-700"></span>
        <button id="btnLogout" class="text-gray-500 hover:text-red-500 text-sm font-medium transition">Çıkış Yap</button>
      </div>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-8 mt-6">
    <div class="bg-white p-6 rounded-xl shadow-md h-fit">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Yeni Konu Aç</h2>
      <div id="loginWarning" class="p-4 bg-yellow-50 text-yellow-800 rounded-lg text-sm mb-4">
        Konu açmak ve cevap yazmak için lütfen giriş yapın.
      </div>
      <form id="forumFormu" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Başlık</label>
          <input type="text" id="konuBaslik" required placeholder="Konu başlığı..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">İçerik</label>
          <textarea id="konuIcerik" rows="4" required placeholder="Neler düşünüyorsun?..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>
        <button type="submit" id="gonderButon" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition shadow-sm">
          Konuyu Yayınla
        </button>
      </form>
      <div id="bildirim" class="mt-4 p-3 rounded-lg text-center font-medium text-sm hidden"></div>
    </div>

    <div class="md:col-span-2 space-y-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Güncel Konular</h2>
      <div id="konularListesi" class="space-y-6">
        <p class="text-gray-500 italic">Konular yükleniyor...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, GithubAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDrUeTr4I4chwxQ1093f2Or3llwUArMYc",
      authDomain: "btu-net.firebaseapp.com",
      projectId: "btu-net",
      storageBucket: "btu-net.firebasestorage.app",
      messagingSenderId: "28114112965",
      appId: "1:28114112965:web:93f844d7d81d9934087bac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const RECAPTCHA_SITE_KEY = "6LfYMPMsAAAAAHnl9mxKR0TgmG-zT_NdIVS72_MC";

    let currentUser = null;

    const authContainer = document.getElementById('authContainer');
    const userProfile = document.getElementById('userProfile');
    const userName = document.getElementById('userName');
    const forumFormu = document.getElementById('forumFormu');
    const loginWarning = document.getElementById('loginWarning');
    const konularListesi = document.getElementById('konularListesi');
    const bildirim = document.getElementById('bildirim');
    
    const customModal = document.getElementById('customModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');

    function showPopup(title, message) {
      modalTitle.innerText = title;
      modalMessage.innerText = message;
      customModal.classList.remove('hidden');
    }
    modalCloseBtn.addEventListener('click', () => customModal.classList.add('hidden'));

    const googleProvider = new GoogleAuthProvider();
    const githubProvider = new GithubAuthProvider();

    document.getElementById('btnGoogle').addEventListener('click', () => {
      signInWithPopup(auth, googleProvider).catch((error) => handleAuthError(error));
    });

    document.getElementById('btnGithub').addEventListener('click', () => {
      signInWithPopup(auth, githubProvider).catch((error) => handleAuthError(error));
    });

    function handleAuthError(error) {
      if (error.code === 'auth/account-exists-with-different-credential') {
        showPopup("E-posta Zaten Kayıtlı!", "Bu e-posta adresi ile daha önce başka bir yöntemle giriş yapılmış. Lütfen ilk kullandığınız yöntemi tercih edin.");
      } else if (error.code !== 'auth/popup-closed-by-user') {
        alert("Giriş yapılırken bir sorun oluştu: " + error.message);
      }
    }

    document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authContainer.classList.add('hidden');
        userProfile.classList.remove('hidden');
        userName.innerText = "👤 " + user.displayName;
        forumFormu.classList.remove('hidden');
        loginWarning.classList.add('hidden');
      } else {
        authContainer.classList.remove('hidden');
        userProfile.classList.add('hidden');
        forumFormu.classList.add('hidden');
        loginWarning.classList.remove('hidden');
      }
      renderPosts();
    });

    let globalPosts = []; 
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      globalPosts = [];
      snapshot.forEach(doc => globalPosts.push({ id: doc.id, ...doc.data() }));
      renderPosts();
    });

    function renderPosts() {
      konularListesi.innerHTML = "";
      if (globalPosts.length === 0) {
        konularListesi.innerHTML = `<p class="text-gray-500 italic bg-white p-6 rounded-xl">Henüz hiç konu açılmamış. İlk konuyu sen aç!</p>`;
        return;
      }

      globalPosts.forEach((veri) => {
        const tarih = veri.createdAt ? new Date(veri.createdAt.seconds * 1000).toLocaleString('tr-TR') : "Şimdi";
        const yazarAdi = veri.authorName || "Anonim";
        const cevaplar = veri.replies || [];

        const cevaplarHTML = cevaplar.map(cevap => `
          <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 mb-2">
            <div class="flex justify-between items-center mb-1">
              <span class="font-medium text-sm text-gray-800">${cevap.author}</span>
              <span class="text-xs text-gray-400">${new Date(cevap.timestamp).toLocaleString('tr-TR')}</span>
            </div>
            <p class="text-sm text-gray-600">${cevap.text}</p>
          </div>
        `).join('');

        const yorumFormuHTML = currentUser ? `
          <div class="mt-4 flex gap-2">
            <input type="text" id="replyInput_${veri.id}" placeholder="Bir cevap yaz..." class="flex-1 px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
            <button onclick="cevapGonder('${veri.id}')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">Gönder</button>
          </div>
        ` : `<p class="mt-4 text-xs text-gray-400 italic">Cevap yazmak için giriş yapmalısınız.</p>`;

        const kartHTML = `
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-xl font-bold text-gray-900">${veri.title}</h3>
              <span class="text-xs text-gray-400 bg-gray-50 px-2 py-1 rounded-md">${tarih}</span>
            </div>
            <div class="flex items-center gap-2 mb-4">
              <span class="text-xs font-medium bg-blue-100 text-blue-800 px-2 py-1 rounded-full">👤 ${yazarAdi}</span>
            </div>
            <p class="text-gray-700 text-base leading-relaxed whitespace-pre-line mb-6">${veri.content}</p>
            
            <div class="border-t border-gray-100 pt-4">
              <h4 class="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wider">Cevaplar (${cevaplar.length})</h4>
              ${cevaplarHTML}
              ${yorumFormuHTML}
            </div>
          </div>
        `;
        konularListesi.innerHTML += kartHTML;
      });
    }

    // --- FORM GÖNDERME (reCAPTCHA v3 Entegrasyonu Yapıldı) ---
    forumFormu.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const gonderButon = document.getElementById('gonderButon');
      gonderButon.disabled = true;
      gonderButon.innerText = "Doğrulanıyor...";

      // reCAPTCHA v3 çalıştırılıyor
      grecaptcha.ready(() => {
        grecaptcha.execute(RECAPTCHA_SITE_KEY, {action: 'submit_post'}).then(async (token) => {
          
          // NOT: Normalde bu token backend'e gönderilip doğrulanır. 
          // Serverless mimaride botları engellemek için token üretilmiş olmasını kontrol ediyoruz.
          if (!token) {
            showPopup("Güvenlik Engeli!", "reCAPTCHA doğrulaması başarısız oldu. Lütfen bot olmadığınızdan emin olun.");
            gonderButon.disabled = false;
            gonderButon.innerText = "Konuyu Yayınla";
            return;
          }

          // Token başarıyla üretildiyse veri tabanına ekleme aşamasına geçiyoruz
          gonderButon.innerText = "Yayınlanıyor...";
          const baslik = document.getElementById('konuBaslik').value;
          const icerik = document.getElementById('konuIcerik').value;

          try {
            await addDoc(collection(db, "posts"), {
              title: baslik,
              content: icerik,
              authorName: currentUser.displayName,
              authorId: currentUser.uid,
              createdAt: serverTimestamp(),
              replies: []
            });

            bildirim.className = "mt-4 p-3 rounded-lg text-center font-medium text-sm bg-green-100 text-green-800 block";
            bildirim.innerText = "✓ Konu başarıyla yayınlandı!";
            forumFormu.reset();
            setTimeout(() => { bildirim.classList.add('hidden'); }, 3000);

          } catch (error) {
            bildirim.className = "mt-4 p-3 rounded-lg text-center font-medium text-sm bg-red-100 text-red-800 block";
            bildirim.innerText = "✗ Hata: " + error.message;
          } finally {
            gonderButon.disabled = false;
            gonderButon.innerText = "Konuyu Yayınla";
          }
        });
      });
    });

    // --- CEVAP GÖNDERME ---
    window.cevapGonder = async (postId) => {
      if (!currentUser) return;
      const inputEl = document.getElementById(`replyInput_${postId}`);
      const metin = inputEl.value.trim();
      
      if (!metin) return;
      inputEl.disabled = true;

      try {
        const postRef = doc(db, "posts", postId);
        await updateDoc(postRef, {
          replies: arrayUnion({
            text: metin,
            author: currentUser.displayName,
            authorId: currentUser.uid,
            timestamp: Date.now()
          })
        });
      } catch (error) {
        alert("Cevap gönderilirken hata oluştu: " + error.message);
      } finally {
        inputEl.disabled = false;
        inputEl.value = "";
      }
    };
  </script>
</body>
</html>
